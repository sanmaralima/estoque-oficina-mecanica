<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Sistema de Estoque - Oficina Mecânica</title>
</head>
<body>
  <h2>Sistema de Estoque - Oficina Mecânica</h2>
  <hr>
  <table>
    <tr><td>USUÁRIO</td><td><input type="text" id="usuario"></td></tr>
    <tr><td>SENHA</td><td><input type="password" id="senha"></td></tr>
    <tr><td></td><td><input type="button" value="ENTRAR" onclick="entrar()"></td></tr>
  </table>
  <script>
    function entrar() {
      var usuario = document.getElementById("usuario").value.trim();
      if (usuario === "") {
        window.location.href = "msg.html";      // usuário em branco -> erro
      } else if (usuario === "admin") {
        window.location.href = "pg001.html";    // admin -> administrador
      } else {
        window.location.href = "pg002.html";    // qualquer outro -> operador
      }
    }
  </script>
</body>
</html>
